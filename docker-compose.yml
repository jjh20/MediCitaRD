services:
  postgres:
    image: postgres:16-alpine
    container_name: medicita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicita}
      POSTGRES_DB: ${POSTGRES_DB:-medicita}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medicita_pgdata:/var/lib/postgresql/data
      # Crea la base "medicita_test" para las pruebas e2e en el primer arranque
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicita} -d ${POSTGRES_DB:-medicita}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  medicita_pgdata:
